server {
    listen 80;
    listen [::]:80;
    server_name sofastai.com www.sofastai.com;

    access_log /www/wwwlogs/sofastai.com.log;
    error_log /www/wwwlogs/sofastai.com.error.log;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/sofastai.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sofastai.com www.sofastai.com;

    access_log /www/wwwlogs/sofastai.com.log;
    error_log /www/wwwlogs/sofastai.com.error.log;

    ssl_certificate /etc/nginx/ssl/sofastai.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/sofastai.com/sofastai.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 256m;
    }
}
